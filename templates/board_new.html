<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发帖 - 拼饭广场 - 寻味广外</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% include '_nav.html' %}

  <div class="container">

    <a class="back-link" href="/board">← 返回拼饭广场</a>

    <h1 class="detail-title">发一条拼饭帖</h1>
    <p class="detail-meta">把你的想法说清楚，别人看到了才好联系你。</p>

    {% if error %}
      <div class="form-card" style="border-left: 4px solid var(--color-danger); margin-top: 16px;">
        <p style="margin: 0; color: var(--color-danger); font-weight: 600;">{{ error }}</p>
      </div>
    {% endif %}

    <div class="form-card" style="margin-top: 20px;">
      <form method="post">
        <p>
          <label>想说什么</label>
          <textarea name="content" rows="5" required maxlength="500"
                    placeholder="例：明天中午想去一期二楼风情水煮，有没有一起的？我想凑单满减。"></textarea>
        </p>
        <p>
          <label>约饭时间（可选）</label>
          <input type="text" name="when_time" maxlength="40"
                 placeholder="例：明天中午 12:00">
        </p>
        <p>
          <label>关联窗口（可选）</label>
          <select name="stall_id">
            <option value="">— 不关联 —</option>
            {% for s in all_stalls %}
              <option value="{{ s.id }}">
                {{ s.canteen_name }} · {{ s.name }}
              </option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label>联系方式（可选）</label>
          <input type="text" name="contact" maxlength="60"
                 placeholder="微信号 / QQ，方便别人私聊你">
        </p>
        <p>
          <button type="submit" class="btn">发布</button>
        </p>
      </form>
    </div>

  </div>

{% include '_footer.html' %}

</body>
</html>
