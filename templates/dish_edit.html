<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑 {{ dish.name }} - 寻味广外</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% include '_nav.html' %}

  <div class="container">

    <a class="back-link" href="/admin/dishes">← 返回菜品管理</a>

    <h1 class="detail-title">编辑菜品</h1>

    <div class="form-card">
      <form method="post" enctype="multipart/form-data">
        <p>
          <label>菜名</label>
          <input type="text" name="name" required maxlength="40"
                 value="{{ dish.name }}">
        </p>
        <p>
          <label>所属窗口</label>
          <select name="stall_id" required>
            {% for s in all_stalls %}
              <option value="{{ s.id }}"
                      {% if dish.stall_id == s.id %}selected{% endif %}>
                {{ s.canteen_name }} · {{ s.name }}
              </option>
            {% endfor %}
          </select>
        </p>
        <p>
          <label>价格（元）</label>
          <input type="text" name="price" required value="{{ dish.price }}">
        </p>
        <p>
          <label>餐次</label>
          <select name="meal">
            {% for m in meals %}
              <option value="{{ m }}"
                      {% if dish.meal == m %}selected{% endif %}>
                {{ meal_label[m] }}
              </option>
            {% endfor %}
          </select>
        </p>

        <p>
          <label>供应日（不选=每天）</label>
          <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px;">
            {% set current_days = (dish.weekdays or "").split(",") %}
            {% for w, label in weekday_labels.items() %}
              <label style="font-weight: normal; display: flex; align-items: center; gap: 4px; cursor: pointer;">
                <input type="checkbox" name="weekdays" value="{{ w }}"
                       {% if w|string in current_days %}checked{% endif %}
                       style="width: auto; margin: 0;">
                {{ label }}
              </label>
            {% endfor %}
          </div>
          <p style="font-size: 12.5px; color: var(--text-tertiary); margin-top: 6px;">
            不勾任何 → 默认每天都有
          </p>
        </p>

        {# 当前图片（如果有） #}
        {% if dish.image %}
          <p>
            <label>当前照片</label>
            <img src="/static/dish_images/{{ dish.image }}"
                 alt="{{ dish.name }}"
                 style="max-width: 220px; border-radius: 14px; display: block; margin-bottom: 8px;">
            <label style="font-weight: normal; color: #666; font-size: 13.5px;">
              <input type="checkbox" name="remove_image" value="1"
                     style="width: auto; margin-right: 6px;">
              删除这张照片（保存后生效）
            </label>
          </p>
        {% endif %}

        <p>
          <label>
            {% if dish.image %}换一张新照片（可选）{% else %}上传照片（可选）{% endif %}
          </label>
          <input type="file" name="image" accept="image/*">
        </p>

        <p>
          <label>徽章</label>
          <label style="font-weight: normal; display: block; margin-top: 4px;">
            <input type="checkbox" name="is_new" value="1"
                   {% if dish.is_new %}checked{% endif %}
                   style="width: auto; margin-right: 8px;">
            新品（新上架）
          </label>
        </p>

        <p>
          <label>辣度</label>
          <select name="spicy_level">
            <option value="0" {% if dish.spicy_level == 0 %}selected{% endif %}>不辣</option>
            <option value="1" {% if dish.spicy_level == 1 %}selected{% endif %}>🌶️ 微辣</option>
            <option value="2" {% if dish.spicy_level == 2 %}selected{% endif %}>🌶️🌶️ 中辣</option>
            <option value="3" {% if dish.spicy_level == 3 %}selected{% endif %}>🌶️🌶️🌶️ 特辣</option>
          </select>
        </p>

        <p style="background: var(--bg-subtle); padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.7; color: var(--text-secondary);">
          💡「招牌」由系统根据学生评分自动判定：<br>
          · 至少 5 条评价<br>
          · 且平均分 ≥ 4.5 分
        </p>

        <p>
          <label>简介</label>
          <textarea name="description" rows="3" maxlength="200">{{ dish.description or "" }}</textarea>
        </p>
        <p>
          <button type="submit" class="btn">保存修改</button>
        </p>
      </form>
    </div>

  </div>

  {% include '_footer.html' %}

</body>
</html>
