<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 寻味广外</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% include '_nav.html' %}

  <div class="container">

    <div style="max-width: 420px; margin: 40px auto;">
      <h1 class="detail-title" style="text-align: center;">注册账号</h1>
      <p class="detail-meta" style="text-align: center;">
        有了账号才能评价、拼饭、反馈。
      </p>

      {% if error %}
        <div class="form-card" style="border-left: 4px solid var(--color-danger); margin-top: 20px;">
          <p style="margin: 0; color: var(--color-danger); font-weight: 600;">{{ error }}</p>
        </div>
      {% endif %}

      <div class="form-card" style="margin-top: 20px;">
        <form method="post">
          <p>
            <label>邮箱</label>
            <input type="text" name="email" required maxlength="80"
                   placeholder="例：xiaoming@qq.com">
          </p>
          <p>
            <label>真实姓名</label>
            <input type="text" name="nickname" required maxlength="20"
                   placeholder="请填写真实姓名，将展示在评论和拼饭中">
          </p>
          <p style="background: #fff4e6; padding: 10px 14px; border-radius: 8px;
                    font-size: 13px; color: #d9480f; margin-top: -8px; line-height: 1.7;">
            ⚠️ <strong>实名提示：</strong>请使用真实姓名。平台实行实名制，
            伪造姓名可能被管理员禁言。
          </p>
          <p>
            <label>密码</label>
            <input type="password" name="password" required minlength="6"
                   placeholder="至少 6 位">
          </p>
          <p>
            <label>再输一遍密码</label>
            <input type="password" name="password2" required minlength="6">
          </p>
          <p>
            <button type="submit" class="btn" style="width: 100%;">注册</button>
          </p>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
          已有账号？<a href="/signin" style="color: var(--color-primary-dark);">去登录</a>
        </p>
      </div>
    </div>

  </div>

{% include '_footer.html' %}

</body>
</html>
