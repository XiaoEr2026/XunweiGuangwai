<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 寻味广外</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% include '_nav.html' %}

  <div class="container">

    <div style="max-width: 420px; margin: 40px auto;">
      <h1 class="detail-title" style="text-align: center;">登录</h1>
      <p class="detail-meta" style="text-align: center;">
        登录后才能评价、拼饭、反馈
      </p>

      {% if error %}
        <div class="form-card" style="border-left: 4px solid var(--color-danger); margin-top: 20px;">
          <p style="margin: 0; color: var(--color-danger); font-weight: 600;">{{ error }}</p>
        </div>
      {% endif %}

      <div class="form-card" style="margin-top: 20px;">
        <form method="post">
          <p>
            <label>邮箱</label>
            <input type="text" name="email" required maxlength="80"
                   placeholder="注册时用的邮箱">
          </p>
          <p>
            <label>密码</label>
            <input type="password" name="password" required>
          </p>
          <p>
            <button type="submit" class="btn" style="width: 100%;">登录</button>
          </p>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
          还没账号？<a href="/register" style="color: var(--color-primary-dark);">去注册</a>
        </p>
      </div>
    </div>

  </div>

{% include '_footer.html' %}

</body>
</html>
