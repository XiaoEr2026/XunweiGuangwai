<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加菜品 - 寻味广外</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

{% include '_nav.html' %}

  <div class="container">

    <a class="back-link" href="/admin/dishes">← 返回菜品管理</a>

    <h1 class="detail-title">添加菜品</h1>

    {% if all_stalls %}
      <div class="form-card">
        <form method="post" enctype="multipart/form-data">
          <p>
            <label>菜名</label>
            <input type="text" name="name" required maxlength="40"
                   placeholder="例：黑椒牛柳饭">
          </p>
          <p>
            <label>所属窗口</label>
            <select name="stall_id" required>
              {% for s in all_stalls %}
                <option value="{{ s.id }}">
                  {{ s.canteen_name }} · {{ s.name }}
                </option>
              {% endfor %}
            </select>
          </p>
          <p>
            <label>价格（元）</label>
            <input type="text" name="price" required placeholder="例：15 或 15.5">
          </p>
          <p>
            <label>餐次</label>
            <select name="meal">
              {% for m in meals %}
                <option value="{{ m }}">{{ meal_label[m] }}</option>
              {% endfor %}
            </select>
          </p>

          <p>
            <label>供应日（不选=每天）</label>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px;">
              {% for w, label in weekday_labels.items() %}
                <label style="font-weight: normal; display: flex; align-items: center; gap: 4px; cursor: pointer;">
                  <input type="checkbox" name="weekdays" value="{{ w }}"
                         style="width: auto; margin: 0;">
                  {{ label }}
                </label>
              {% endfor %}
            </div>
            <p style="font-size: 12.5px; color: var(--text-tertiary); margin-top: 6px;">
              不勾任何 → 默认每天都有
            </p>
          </p>

          <p>
            <label>菜品照片（可选）</label>
            <input type="file" name="image" accept="image/*">
          </p>

          <p>
            <label>徽章</label>
            <label style="font-weight: normal; display: block; margin-top: 4px;">
              <input type="checkbox" name="is_new" value="1"
                     style="width: auto; margin-right: 8px;">
              新品（新上架）
            </label>
          </p>

          <p>
            <label>辣度</label>
            <select name="spicy_level">
              <option value="0">不辣</option>
              <option value="1">🌶️ 微辣</option>
              <option value="2">🌶️🌶️ 中辣</option>
              <option value="3">🌶️🌶️🌶️ 特辣</option>
            </select>
          </p>

          <p style="background: var(--bg-subtle); padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.7; color: var(--text-secondary);">
            💡「招牌」由系统根据学生评分自动判定：<br>
            · 至少 5 条评价<br>
            · 且平均分 ≥ 4.5 分
          </p>

          <p>
            <label>简介（可选）</label>
            <textarea name="description" rows="3" maxlength="200"
                      placeholder="一句话介绍这道菜"></textarea>
          </p>
          <p>
            <button type="submit" class="btn">添加</button>
          </p>
        </form>
      </div>
    {% else %}
      <div class="empty-state">
        <span class="empty-emoji">🍽️</span>
        <p>还没有任何窗口。请先去
          <a href="/admin/stalls" style="color: var(--color-primary);">管理窗口</a>
          添加。
        </p>
      </div>
    {% endif %}

  </div>

  {% include '_footer.html' %}

</body>
</html>
